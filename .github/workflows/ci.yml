name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to the same pull request replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Node 24: the smoke script needs 22.15 or later (type stripping and module hooks).
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The mod's tests import `claude-code/testing`, which only the Claude Code CLI provides.
      # Pinned to the version the mod was built and tested on. No sign-in is needed for validate and test.
      - name: Install Claude Code 2.1.302
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Validate the plugin
        run: claude plugin validate .

      - name: Run the tests
        run: claude plugin test .

      # Runs the router hooks the way hooks.json does: bad input, UTF-8, rotation, concurrency, opt-outs, latency.
      - name: Check the router hooks
        run: node scripts/router-edge.mjs

      # Builds the Board page from synthetic data and runs its script against a stand-in DOM.
      - name: Smoke-test the Board page
        run: node scripts/smoke-board.mjs "$RUNNER_TEMP/board.html"
